<!DOCTYPE html>
<html lang="en">
<!-- KT OVERLAYS — loaded as a fragment by index.html. This file is NOT standalone. -->
<!-- These elements are injected into #root in index.html via the script tag below. -->
<!--
  USAGE: Add this to index.html before </body>:
    <script>
      fetch('/kt-overlays.html').then(r=>r.text()).then(html=>{
        const frag = document.createElement('div');
        frag.innerHTML = html;
        document.getElementById('root').appendChild(frag);
      });
    </script>
-->
</html>
